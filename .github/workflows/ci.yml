name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Platform-independent checks: formatting and frontend lint.
  style:
    name: Format, ESLint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # rust-toolchain.toml makes rustup install the pinned toolchain and components.
      - run: pnpm format:check
      - run: pnpm exec eslint .
      - run: pnpm typecheck

  # Clippy, tests and build run on Windows so `cfg(target_os = "windows")` code is covered.
  windows:
    name: Clippy, test & build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Tauri app embeds the built frontend (apps/desktop/dist) at compile time.
      - run: pnpm --filter @lextrail/desktop build
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # Plain `cargo build` runs Tauri in dev mode (loads devUrl); `tauri build` produces
      # the real app with the frontend embedded. Bundling (installers) comes in M6.
      - run: pnpm --filter @lextrail/desktop tauri build --no-bundle -- --locked
