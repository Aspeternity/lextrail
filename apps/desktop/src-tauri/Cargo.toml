[package]
name = "lextrail-desktop"
description = "LexTrail desktop app (Tauri shell: tray, hotkeys, window management)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
lextrail-capture = { path = "../../../crates/lextrail-capture" }
lextrail-config = { path = "../../../crates/lextrail-config" }
lextrail-core = { path = "../../../crates/lextrail-core" }
lextrail-dict = { path = "../../../crates/lextrail-dict" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-single-instance = "2.5"

[target.'cfg(windows)'.dependencies]
# Same versions as Tauri's own WebView2 bindings.
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
rusqlite = "0.40"
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
