[package]
name = "lextrail-dict-builder"
description = "Builds the LexTrail compact dictionary from a pinned ECDICT release (D038)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
csv = "1"
lextrail-dict = { path = "../../crates/lextrail-dict" }
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.11"
ureq = "3"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
