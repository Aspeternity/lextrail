     and its prompt takes focus and covers the word. -->
<html translate="no">
  <head>
    <meta charset="utf-8" />
    <meta name="google" content="notranslate" />
    <title>lextrail-e2e</title>
    <style>
      body {
        margin: 0;
      }
      ul {
        margin: 0;
        padding: 24px 48px;
      }
      li {
        font-size: 56px;
        line-height: 1.3;
      }
    </style>
  </head>
  <body>
    <!-- popup-e2e.ps1 double-clicks the first word of this list item. -->
    <ul>
      <li>launch missiles at ships. Another sentence.</li>
    </ul>
  </body>
</html>
